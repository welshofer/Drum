name: Drum
options:
  bundleIdPrefix: com.welshofer
  deploymentTarget:
    macOS: "26.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

packages:
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    from: "1.20.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: YES
    MTL_TREAT_WARNINGS_AS_ERRORS: YES
    MTL_ENABLE_DEBUG_INFO: INCLUDE_SOURCE
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: NO
    ENABLE_APP_SANDBOX: NO
    DEAD_CODE_STRIPPING: YES

targets:
  Drum:
    type: application
    platform: macOS
    sources:
      - path: Drum
        excludes:
          - "Resources/Fonts/**"
      - path: Drum/Resources/Fonts
        type: folder
        buildPhase: resources
    dependencies:
      - package: SwiftTerm
        product: SwiftTerm
    info:
      path: Drum/Info.plist
      properties:
        CFBundleName: Drum
        CFBundleDisplayName: Drum
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSMinimumSystemVersion: "26.0"
        LSApplicationCategoryType: public.app-category.developer-tools
        NSHumanReadableCopyright: "© 2026 Jeff Welshofer"
        NSPrincipalClass: NSApplication
        NSSupportsAutomaticTermination: false
        NSSupportsSuddenTermination: false
        ATSApplicationFontsPath: Fonts
        NSAppleEventsUsageDescription: "Drum runs your shell."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.welshofer.Drum
        PRODUCT_NAME: Drum
        MACOSX_DEPLOYMENT_TARGET: "26.0"
        COMBINE_HIDPI_IMAGES: YES
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: ""
        SWIFT_EMIT_LOC_STRINGS: NO
    scheme:
      testTargets:
        - DrumTests
      gatherCoverageData: false

  DrumTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: DrumTests
    dependencies:
      - target: Drum
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.welshofer.DrumTests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Drum.app/Contents/MacOS/Drum"
        BUNDLE_LOADER: "$(TEST_HOST)"
